     usuarios/{uid}/trabajos/datos (nunca en el documento de Steadfast). Steadfast lee
     ese documento y arma solo los movimientos de Finanzas (ver pf_aplicarTrabajos). -->

  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCredential, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, getDoc, onSnapshot }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  const app = initializeApp({
    apiKey: "AIzaSyBk3rAYyAIHu9Rna6fOycCEJVjx6fs7cxg",
    authDomain: "sistema-tracy.firebaseapp.com",
    projectId: "sistema-tracy",
    storageBucket: "sistema-tracy.firebasestorage.app",
    messagingSenderId: "245671404273",
    appId: "1:245671404273:web:6aa60f32ac1b0960463f50"
  });
  window.fb = { auth: getAuth(app), db: getFirestore(app), provider: new GoogleAuthProvider(),
    GoogleAuthProvider, signInWithPopup, signInWithCredential, signOut, onAuthStateChanged, doc, setDoc, getDoc, onSnapshot };
  window.dispatchEvent(new Event('fb-listo'));
</script>

<style>
  :root {
    --bg: #F5F0EB; --card: #FFFFFF; --text: #1A1A1A; --muted: #7A716A; --border: #E6DED6;
    --accent: #E8450A; --accent-soft: #FCE9E1; --on-accent: #FFFFFF;

      --shade: rgba(0,0,0,.55); color-scheme: dark;
      --mat: #4A5A70; --accent-2: #9A4A2E; --grid: #2A3A4F;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-sans); font-size: 15px; }
  .num { font-family: var(--f-sans); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .tight { font-weight: 700; letter-spacing: -.045em; line-height: .95; }
  .titulo { font-family: var(--f-titulo); font-weight: 700; text-transform: uppercase; word-spacing: .12em; margin: 0; font-size: 24px; line-height: 1; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 110px) max(16px, env(safe-area-inset-left, 0px)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  header h1 img { width: 30px; height: 30px; border-radius: 8px; }
  .cuenta { border: 1px solid var(--border); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; max-width: 55%; }
  .cuenta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .aviso { background: var(--card); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.4; }
  .aviso b { font-size: 15px; }

  .hero { background: var(--accent); color: var(--on-accent); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .row.gan > span { color: var(--ok) !important; font-weight: 700; }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; }
  .nota-w { font-size: 12.5px; color: var(--warn); line-height: 1.4; }
  .acciones { display: flex; gap: 8px; }
  .act { flex: 1; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; padding: 12px; cursor: pointer; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .pctb { align-self: center; font-size: 13px; color: var(--muted); }
  .calc { background: var(--card); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }

  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 0; border-radius: 99px; padding: 9px 16px; font-weight: 700; font-size: 14px; letter-spacing: -.02em; background: var(--card); color: var(--muted); cursor: pointer; }

  .card .bajada { margin: -6px 0 0; font-size: 13px; color: var(--muted); }

  .meses button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .hero .vs { font-size: 14px; font-weight: 600; opacity: .95; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile small, .tile span { font-size: 12px; color: var(--muted); }
  .tile b { font-size: 28px; }
  .grafico svg { display: block; width: 100%; height: auto; }
  .grafico text { font-family: var(--f-sans); fill: var(--muted); font-size: 11px; }
  .split { display: flex; height: 28px; gap: 2px; }

  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .leyenda b { color: var(--text); }
  .rank { display: flex; flex-direction: column; gap: 10px; }
  .rank .r { display: grid; grid-template-columns: 96px 1fr 76px; gap: 8px; align-items: center; font-size: 14px; }
  .rank .r span:first-child { font-weight: 700; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .r span:last-child { text-align: right; }
  .rank .pista { background: var(--grid); border-radius: 4px; height: 12px; }
  .rank .barra { height: 12px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .alerta { background: var(--card); border-radius: 18px; padding: 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; }
  .alerta .punto { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .alerta a, .wa { color: var(--accent); font-weight: 700; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.35; z-index: 10; white-space: nowrap; }
  .fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); background: var(--accent); color: var(--on-accent); border: 0; border-radius: 99px; padding: 14px 20px; font-weight: 600; font-size: 15px; box-shadow: 0 8px 24px rgba(232,69,10,.35); cursor: pointer; }
  .shade { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 92%; overflow: auto; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; gap: 12px;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); background: var(--text); color: var(--bg); border-radius: 16px; padding: 10px 14px; font-size: 14px; z-index: 30; display: flex; gap: 12px; align-items: center; width: max-content; max-width: calc(100% - 32px); }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; flex: none; }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: sube .25s ease; }
    @keyframes sube { from { transform: translateY(24px); opacity: .5; } }
  }
</style>

<body>
<div class="wrap">
  <header>
    <h1><img src="./trabajos-icon-192.png" alt="">Trabajos</h1>
    <button class="cuenta" id="btnCuenta" type="button"><i id="syncDot"></i><span id="cuentaTxt">Entrar</span></button>
  </header>

  <section class="aviso" id="avisoLogin" hidden>
    <b>Entrá con la misma cuenta de Google de Steadfast</b>
    <span>Así tus trabajos se guardan en la nube y los cobros, los materiales y las ganancias aparecen solos en Finanzas.</span>
    <div id="gBtn" style="min-height:44px;display:flex;justify-content:center"></div>
    <button class="mini" type="button" id="btnEntrar">¿No aparece el botón? Probá por acá</button>
  </section>

  <nav class="tabs" aria-label="Secciones"><button type="button" class="on" data-vista="trabajos">Trabajos</button><button type="button" data-vista="numeros">Números</button></nav>

  <div id="vTrabajos" style="display:flex;flex-direction:column;gap:16px">

    <div class="big num" id="hParaPasar">0 Gs</div>
    <div class="de" id="hParaPasarDe"></div>
    <button type="button" id="btnPasar">Ya la pasé al banco</button>
  </section>

  <section class="duo">
    <div class="stat"><small>Me deben</small><span class="v num" id="hDeben">0 Gs</span><small id="hDebenQuien"></small></div>
    <div class="stat"><small id="hMesLbl">Ganancia del mes</small><span class="v num" id="hMes">0 Gs</span><small id="hMesN"></small></div>
  </section>

  <nav class="seg" id="seg" aria-label="Filtrar trabajos"></nav>
  <section class="list" id="list"></section>
  </div>

  <div id="vNumeros" hidden style="display:flex;flex-direction:column;gap:14px"></div>

<button class="fab" id="fab" type="button">+ Nuevo trabajo</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
// ── Datos ──
const KEY = 'steadfast_trabajos_v1';
const ETAPAS = [
  { k: 'presupuesto', n: 'Presupuesto enviado' },
  { k: 'sena',        n: 'Seña recibida' },
  { k: 'proceso',     n: 'En proceso' },
  { k: 'entregado',   n: 'Entregado' },
  { k: 'pagado',      n: 'Pagado completo' }
];
const TIPOS = ['Remeras', 'Página web', 'Diseño', 'Informática', 'Otro'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let datos = { trabajos: [] };
try { const g = JSON.parse(localStorage.getItem(KEY)); if (g && Array.isArray(g.trabajos)) datos = g; } catch (e) {}
let filtro = 'activos';
let abiertos = new Set();
let usuario = null, primerSnap = false;

const uid = () => 'tb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ahoraIso = () => new Date().toISOString();
function hoyStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const fmt = n => Math.round(n || 0).toLocaleString('es-PY').replace(/,/g, '.');
const gs = n => fmt(n) + ' Gs';
const pct = (a, T) => T ? Math.round(a / T * 100) + '%' : '0%';
const num = v => parseInt(String(v || '').replace(/\D/g, ''), 10) || 0;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const activos = () => datos.trabajos.filter(j => !j.eliminado);
const total = j => j.items.reduce((a, i) => a + i.c, 0) * j.precioU;
const gasto = j => j.gastos.reduce((a, g) => a + g.m, 0);
const gan = j => total(j) - gasto(j);
const cobrado = j => j.etapa === 'pagado' ? total(j) : (j.etapa === 'presupuesto' ? 0 : j.sena || 0);
const idx = k => ETAPAS.findIndex(e => e.k === k);
const unidades = j => j.items.reduce((a, i) => a + i.c, 0);

function guardar(j) {
  if (j) j.updatedAt = ahoraIso();
  try { localStorage.setItem(KEY, JSON.stringify(datos)); } catch (e) {}
  subir();
  render();
}

// ── Firebase: usuarios/{uid}/trabajos/datos, fusión por id con updatedAt ──
function fusionar(local, remoto) {
  const m = new Map();
  (local || []).forEach(x => m.set(x.id, x));
  (remoto || []).forEach(x => { const l = m.get(x.id); if (!l || (x.updatedAt || '') > (l.updatedAt || '')) m.set(x.id, x); });
  return [...m.values()].sort((a, b) => (b.creado || '').localeCompare(a.creado || ''));
}
function ref() { return window.fb.doc(window.fb.db, 'usuarios', usuario.uid, 'trabajos', 'datos'); }
function sync(estado) { const d = document.getElementById('syncDot'); d.className = estado; }
let subiendo = null;
async function subir() {
  if (!usuario || !primerSnap) return;
  clearTimeout(subiendo);
  subiendo = setTimeout(async () => {
    sync('sync');
    try {
      const snap = await window.fb.getDoc(ref());
      if (snap.exists()) datos.trabajos = fusionar(datos.trabajos, JSON.parse(snap.data().trabajos || '[]'));
      await window.fb.setDoc(ref(), { trabajos: JSON.stringify(datos.trabajos), updatedAt: ahoraIso() });
      localStorage.setItem(KEY, JSON.stringify(datos));
      sync('ok');
    } catch (e) {
      console.warn('No se pudo guardar en la nube', e);
      sync('');
      toast('No se pudo guardar en la nube. Queda en este teléfono y se reintenta.');
    }
  }, 400);
}
let cortarSnap = null;
function escuchar() {
  if (cortarSnap) cortarSnap();
  cortarSnap = window.fb.onSnapshot(ref(), snap => {
    const primera = !primerSnap;
    primerSnap = true;
    if (snap.metadata.hasPendingWrites) return;
    const remoto = snap.exists() ? JSON.parse(snap.data().trabajos || '[]') : [];
    const antes = JSON.stringify(datos.trabajos);
    datos.trabajos = fusionar(datos.trabajos, remoto);
    try { localStorage.setItem(KEY, JSON.stringify(datos)); } catch (e) {}
    if (JSON.stringify(datos.trabajos) !== antes) render();
    sync('ok');
    // Si acá había trabajos que la nube no tenía (cargados sin sesión), se suben.
    if (primera && datos.trabajos.length !== remoto.length) subir();

function siguiente(j) {
  const T = total(j);
  switch (j.etapa) {
    case 'presupuesto': return { t: 'Confirmó: recibí la seña', sena: true };
    case 'sena':        return { t: 'Empecé el trabajo' };
    case 'proceso':     return { t: 'Lo entregué' };
    case 'entregado':   return { t: `Cobré el saldo de ${gs(T - (j.sena || 0))}` };
    default: return null;
  }
}
function avanzar(j) {
  const T = total(j);
  if (j.etapa === 'presupuesto') {
    const inp = document.querySelector(`[data-sena="${j.id}"]`);
    const v = Math.min(num(inp ? inp.value : T / 2), T);
    if (!v) { toast('Escribí cuánto te entregó de seña'); return; }
    conDeshacer(j, () => {
      j.sena = v; j.fechaSena = hoyStr();
      if (v >= T) { j.etapa = 'pagado'; j.fechaPago = hoyStr(); } else j.etapa = 'sena';
    }, `Seña de ${gs(v)} anotada`);
  } else if (j.etapa === 'sena') conDeshacer(j, () => { j.etapa = 'proceso'; }, 'En proceso');
  else if (j.etapa === 'proceso') conDeshacer(j, () => { j.etapa = 'entregado'; j.fechaEntrega = hoyStr(); }, 'Entregado');
  else if (j.etapa === 'entregado') conDeshacer(j, () => { j.etapa = 'pagado'; j.fechaPago = hoyStr(); },
    `Cobrado. ${gs(gan(j))} de ganancia para pasar al banco`);
}

function tarjeta(j) {
  const T = total(j), G = gasto(j), i = idx(j.etapa), s = siguiente(j), n = unidades(j), abierto = abiertos.has(j.id);
  const resumen = j.items.length > 1 ? `${n} unidades` : (j.items[0] ? (j.items[0].c > 1 ? j.items[0].c + ' × ' : '') + j.items[0].d : '');

  const sena = j.sena || 0;
  return `<article class="job">
    <button type="button" class="job-top" data-open="${j.id}" aria-expanded="${abierto}">
      <div><b>${esc(j.cliente)}</b><p>${esc(j.tipo)} · ${esc(resumen)}</p></div>
      <span class="pill p-${j.etapa}">${ETAPAS[i].n}</span>
    </button>
    <div class="bar ${j.etapa === 'pagado' ? 'done' : ''}" aria-hidden="true">${ETAPAS.map((e, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="money"><span>Total <strong class="num">${gs(T)}</strong></span>${derecha}</div>
    ${abierto ? `<div class="detail">
      <div class="sub">Qué pidió</div>
      ${j.items.map(x => `<div class="row"><span>${x.c} × ${esc(x.d)}</span><span class="num">${gs(x.c * j.precioU)}</span></div>`).join('')}
      <div class="row total"><span>Le cobro (${n} × ${gs(j.precioU)})</span><span class="num">${gs(T)}</span></div>
      <div class="sub">Lo que gasto</div>
      ${G ? j.gastos.map(g => `<div class="row"><span>${esc(g.d)}</span><span class="num">− ${gs(g.m)}</span></div>`).join('') : '<div class="row"><span>Sin gastos</span><span></span></div>'}
      <div class="row total"><span>Gasto total</span><span class="num">− ${gs(G)}</span></div>
      <div class="row gan total"><span>Mi ganancia</span><span class="num">${gs(T - G)}</span></div>
      ${j.etapa === 'presupuesto' ? '' : `<div class="sub">Cobros</div>
        <div class="row"><span>Seña (${pct(sena, T)})</span><span class="num">${gs(sena)} ✓</span></div>
        <div class="row"><span>Saldo</span><span class="num">${gs(T - sena)} ${j.etapa === 'pagado' ? '✓' : 'pendiente'}</span></div>
        ${j.etapa === 'entregado' ? `<a class="wa" href="${linkWhatsApp(j)}" target="_blank" rel="noopener">Recordarle el saldo por WhatsApp</a>` : ''}
        ${G > sena && j.etapa !== 'pagado' ? `<div class="nota-w">Los materiales (${gs(G)}) superan la seña: ponés ${gs(G - sena)} de tu caja hasta cobrar el saldo.</div>` : ''}`}
      ${j.pasado ? `<div class="row"><span>Pasada al banco</span><span class="num">${fechaCorta(j.pasadoEn)} ✓</span></div>` : ''}
      <div class="mini-row">
        <button type="button" class="mini" data-editar="${j.id}">Editar</button>
        ${j.etapa !== 'presupuesto' ? `<button type="button" class="mini" data-volver="${j.id}">Volver una etapa</button>` : ''}
        <button type="button" class="mini" data-borrar="${j.id}">Borrar</button>
      </div>
    </div>` : ''}
    ${s && s.sena ? `<div class="field"><label for="sena${j.id}">Seña que me entregó</label>
      <div class="line"><input id="sena${j.id}" data-sena="${j.id}" data-total="${T}" inputmode="numeric" value="${fmt(Math.round(T / 2))}"><span class="pctb" id="pct${j.id}">50% del total</span></div>
      <div class="chips">${[50, 60, 70, 100].map(p => `<button type="button" class="chip" data-pct="${p}" data-for="${j.id}">${p}%</button>`).join('')}</div>
      ${G > T / 2 ? `<div class="nota-w">Los materiales cuestan ${gs(G)}, más que el 50%. Pedí al menos ${pct(G, T)} para no poner plata de tu caja.</div>` : ''}
    </div>` : ''}
    ${s ? `<div class="acciones"><button type="button" class="act" data-next="${j.id}">${s.t}</button></div>` : ''}
  </article>`;
}
function fechaCorta(iso) { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${+d}/${+m}`; }

// ── Toques ──
const buscar = id => datos.trabajos.find(x => x.id === id);
document.addEventListener('click', e => {

    return; }

  if (br) { const j = buscar(br.dataset.borrar); conDeshacer(j, () => { j.eliminado = true; }, `Borraste el trabajo de ${j.cliente}`); return; }
  if (t.closest('[data-cerrar]') || t.id === 'shade') cerrarHoja();
});
document.addEventListener('input', e => {
  const i = e.target.closest('[data-sena]'); if (!i) return;

});
document.getElementById('btnPasar').onclick = () => {

  if (!p.length) return;

};

// ── Hoja para cargar o editar un trabajo ──
function abrirHoja(html) {
  document.getElementById('sheetRoot').innerHTML = `<div class="shade" id="shade"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
}
function cerrarHoja() { document.getElementById('sheetRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

function abrirFormulario(j) {
  const nuevo = !j;
  const base = j || { tipo: 'Remeras', items: [{ c: 1, d: '' }], precioU: 0, gastos: [{ d: 'Remeras', m: 0 }, { d: 'Impresión DTF', m: 0 }, { d: 'Transportadora', m: 0 }] };
  const itemRow = x => `<div class="line3x"><input inputmode="numeric" value="${x.c || ''}" aria-label="Cantidad" class="iC" placeholder="1"><input value="${esc(x.d)}" placeholder="Remeras grises G" aria-label="Qué pidió" class="iD"><button type="button" class="x" data-quitar aria-label="Quitar">✕</button></div>`;
  const gastoRow = g => `<div class="line-x"><input value="${esc(g.d)}" placeholder="Otro gasto" aria-label="Gasto" class="gD"><input inputmode="numeric" placeholder="0" value="${g.m ? fmt(g.m) : ''}" aria-label="Monto" class="gM"><button type="button" class="x" data-quitar aria-label="Quitar">✕</button></div>`;
  abrirHoja(`<form id="fTrabajo" class="sheet-in" style="display:flex;flex-direction:column;gap:12px">
    <div class="sheet-top"><h2>${nuevo ? 'Nuevo trabajo' : 'Editar trabajo'}</h2><button class="x" type="button" data-cerrar aria-label="Cerrar">✕</button></div>

    <div class="chips" role="group" aria-label="Tipo de trabajo">${TIPOS.map(t => `<button type="button" class="chip ${t === base.tipo ? 'on' : ''}" data-tipo="${t}">${t}</button>`).join('')}</div>
    <div class="lbl">Qué pidió (cantidad y detalle)</div>

    <button type="button" class="chip" id="addItem" style="align-self:flex-start">+ Otra línea</button>
    <div class="field"><label for="nPrecio">Le cobro por unidad (Gs)</label><input id="nPrecio" inputmode="numeric" placeholder="85.000" value="${base.precioU ? fmt(base.precioU) : ''}"></div>
    <div class="lbl">Lo que gasto (materiales y envío)</div>
    <div id="nGastos" style="display:flex;flex-direction:column;gap:8px">${base.gastos.map(gastoRow).join('')}</div>
    <button type="button" class="chip" id="addGasto" style="align-self:flex-start">+ Otro gasto</button>
    <div class="calc" id="nCalc" aria-live="polite"></div>
    <button class="act" type="submit">${nuevo ? 'Guardar presupuesto' : 'Guardar cambios'}</button>
  </form>`);
  let tipo = base.tipo;
  const form = document.getElementById('fTrabajo');
  const leer = () => ({
    items: [...form.querySelectorAll('.line3x')].map(r => ({ c: num(r.querySelector('.iC').value), d: r.querySelector('.iD').value.trim() })).filter(x => x.c),
    gastos: [...form.querySelectorAll('.line-x')].map(r => ({ d: r.querySelector('.gD').value.trim() || 'Gasto', m: num(r.querySelector('.gM').value) })).filter(g => g.m),
    precioU: num(document.getElementById('nPrecio').value)
  });
  const calc = () => {
    const v = leer(), n = v.items.reduce((a, i) => a + i.c, 0), T = n * v.precioU, G = v.gastos.reduce((a, g) => a + g.m, 0);
    document.getElementById('nCalc').innerHTML = `
      <div class="row"><span>Le cobro (${n} × ${gs(v.precioU)})</span><span class="num">${gs(T)}</span></div>
      <div class="row"><span>Gasto total</span><span class="num">− ${gs(G)}</span></div>
      <div class="row gan total"><span>Mi ganancia</span><span class="num">${gs(T - G)}</span></div>
      <div class="row"><span>Seña del 50% (la ajustás al confirmar)</span><span class="num">${gs(T / 2)}</span></div>`;
  };
  // Formatea los montos con puntos mientras se escriben
  form.addEventListener('input', e => {
    if (e.target.matches('#nPrecio, .gM') && e.target.value) { const n = num(e.target.value); e.target.value = n ? fmt(n) : ''; }
    calc();
  });
  form.addEventListener('click', e => {
    const tp = e.target.closest('[data-tipo]');
    if (tp) { tipo = tp.dataset.tipo; form.querySelectorAll('[data-tipo]').forEach(b => b.classList.toggle('on', b === tp)); }

  });

  document.getElementById('addGasto').onclick = () => { document.getElementById('nGastos').insertAdjacentHTML('beforeend', gastoRow({ d: '', m: 0 })); calc(); };
  form.onsubmit = e => {
    e.preventDefault();
    const v = leer();
    const cliente = document.getElementById('nCliente').value.trim();
    if (!cliente) { toast('Poné el nombre del cliente'); return; }
    if (!v.items.length) v.items = [{ c: 1, d: tipo }];
    v.items.forEach(x => { if (!x.d) x.d = tipo; });
    if (!v.precioU) { toast('Poné cuánto le cobrás por unidad'); return; }
    v.gastos.forEach(g => g.id = g.id || uid());
    if (nuevo) {
      const j = { id: uid(), cliente, tipo, ...v, etapa: 'presupuesto', sena: 0, pasado: false, creado: ahoraIso() };
      datos.trabajos.unshift(j);
      abiertos.add(j.id);
      filtro = 'activos';

      Object.assign(j, { cliente, tipo, ...v });
      if (j.sena > total(j)) j.sena = total(j);
      cerrarHoja(); guardar(j);
      toast('Cambios guardados');
    }
  };
  calc();
  if (nuevo) setTimeout(() => document.getElementById('nCliente').focus(), 50);
}

  document.getElementById('vNumeros').hidden = vista !== 'numeros';
  document.getElementById('fab').hidden = vista !== 'trabajos';
  render();
  window.scrollTo({ top: 0 });
});

// ── Números: todo sale de los trabajos cobrados (por la fecha en que pagaron todo) ──
let mesNum = hoyStr().slice(0, 7);
const MES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mesNombre = k => MESES[+k.slice(5, 7) - 1];
const mesCorto = k => MES_CORTO[+k.slice(5, 7) - 1];
function mesMenos(k, n) { const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 - n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
const gsK = n => Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M' : Math.round(n / 1000) + ' mil';
function datosMes(k) {
  const js = activos().filter(j => j.etapa === 'pagado' && (j.fechaPago || '').slice(0, 7) === k);
  const cob = js.reduce((a, j) => a + total(j), 0), mat = js.reduce((a, j) => a + gasto(j), 0);
  const rem = js.filter(j => j.tipo === 'Remeras');
  const porCli = {}, porTipo = {};
  js.forEach(j => { porCli[j.cliente] = (porCli[j.cliente] || 0) + gan(j); porTipo[j.tipo] = (porTipo[j.tipo] || 0) + gan(j); });
  const orden = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
  return { js, cob, mat, gan: cob - mat, unid: rem.reduce((a, j) => a + unidades(j), 0), ganRem: rem.reduce((a, j) => a + gan(j), 0), cli: orden(porCli), tipos: orden(porTipo) };
}
function tip(e, html) {
  const r = document.getElementById('tipRoot'); if (!html) { r.innerHTML = ''; return; }
  r.innerHTML = `<div class="tip">${html}</div>`; const t = r.firstChild;
  t.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - t.offsetWidth - 8)) + 'px'; t.style.top = (e.clientY - t.offsetHeight - 12) + 'px';
}
function graficoMeses(meses) {
  const W = 380, H = 190, pl = 50, pr = 6, pt = 22, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const vals = meses.map(k => datosMes(k).gan), maxV = Math.max(1, ...vals);
  const paso = [100000, 250000, 500000, 1000000, 2500000, 5000000, 10000000].find(p => maxV / p <= 4) || 10000000;
  const max = Math.ceil(maxV / paso) * paso, ticks = []; for (let t = 0; t <= max; t += paso) ticks.push(t);
  const bw = iw / meses.length, barW = Math.min(34, bw - 12), y = v => pt + ih - Math.max(0, v) / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganancia por mes">`;
  ticks.forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t ? gsK(t) : '0'}</text>`; });
  meses.forEach((k, i) => {
    const g = vals[i], x = pl + i * bw + (bw - barW) / 2, yy = y(g), on = k === mesNum;
    if (g > 0) s += `<path d="M${x},${pt + ih} V${yy + 4} Q${x},${yy} ${x + 4},${yy} H${x + barW - 4} Q${x + barW},${yy} ${x + barW},${yy + 4} V${pt + ih} Z" fill="${on ? 'var(--accent)' : 'var(--accent-2)'}"/>`;
    s += `<rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-mesg="${k}" style="cursor:pointer"/>`;
    s += `<text x="${x + barW / 2}" y="${H - 6}" text-anchor="middle" style="${on ? 'fill:var(--text);font-weight:700' : ''}">${mesCorto(k)}</text>`;
    if (on && g > 0) s += `<text x="${x + barW / 2}" y="${yy - 6}" text-anchor="middle" style="fill:var(--text);font-weight:700">${gsK(g)}</text>`;
  });
  return s + '</svg>';
}
function ranking(rows) {
  if (!rows.length) return '<p class="bajada" style="margin:0">Todavía nada este mes.</p>';
  const max = Math.max(1, ...rows.map(r => r[1]));
  return '<div class="rank">' + rows.slice(0, 5).map(([n, v]) => `<div class="r"><span>${esc(n)}</span><div class="pista"><div class="barra" style="width:${Math.max(0, v) / max * 100}%"></div></div><span class="num">${gsK(v)}</span></div>`).join('') + '</div>';
}
function renderNumeros() {
  const el = document.getElementById('vNumeros');
  const hoyK = hoyStr().slice(0, 7);
  const meses = [5, 4, 3, 2, 1, 0].map(n => mesMenos(hoyK, n));
  if (!meses.includes(mesNum)) mesNum = hoyK;
  const d = datosMes(mesNum), i = meses.indexOf(mesNum), prevK = mesMenos(mesNum, 1), prev = datosMes(prevK).gan;
  const vs = !d.js.length ? 'Todavía no cobraste ningún trabajo completo este mes'
    : prev > 0 ? `${d.gan >= prev ? '▲' : '▼'} ${Math.abs(Math.round((d.gan - prev) / prev * 100))}% vs ${mesNombre(prevK)} (${gs(prev)})` : `${d.js.length} trabajo${d.js.length === 1 ? '' : 's'} cobrado${d.js.length === 1 ? '' : 's'}`;
  const deben = activos().filter(j => j.etapa !== 'presupuesto' && j.etapa !== 'pagado');
  const debenM = deben.reduce((a, j) => a + total(j) - cobrado(j), 0);
  const hoy = new Date(hoyStr() + 'T00:00:00');
  const atrasados = activos().filter(j => j.etapa === 'entregado' && j.fechaEntrega && (hoy - new Date(j.fechaEntrega + 'T00:00:00')) / 864e5 >= 3);
  const pm = d.cob ? Math.round(d.mat / d.cob * 100) : 0;
  el.innerHTML = `
    <nav class="meses" aria-label="Mes">${meses.map(k => `<button type="button" class="${k === mesNum ? 'on' : ''}" data-mesn="${k}">${mesNombre(k)}</button>`).join('')}</nav>
    <section class="hero"><small>Ganancia de ${mesNombre(mesNum)}</small><div class="big num">${gs(d.gan)}</div><div class="vs">${vs}</div></section>
    <section class="tiles">
      <div class="tile"><small>Margen promedio</small><b class="num">${d.cob ? Math.round(d.gan / d.cob * 100) + '%' : '—'}</b><span>de cada guaraní cobrado</span></div>
      <div class="tile"><small>Ganancia por remera</small><b class="num">${d.unid ? gsK(d.ganRem / d.unid) : '—'}</b><span>${d.unid} remera${d.unid === 1 ? '' : 's'} vendida${d.unid === 1 ? '' : 's'}</span></div>
      <div class="tile"><small>Trabajos cobrados</small><b class="num">${d.js.length}</b><span>${d.js.length ? 'promedio ' + gsK(d.gan / d.js.length) + ' cada uno' : 'en ' + mesNombre(mesNum)}</span></div>
      <div class="tile"><small>Me deben hoy</small><b class="num">${gsK(debenM)}</b><span>${deben.length ? esc(deben.map(j => j.cliente).join(', ')) : 'Nadie te debe'}</span></div>
    </section>
    ${atrasados.map(j => `<section class="alerta"><span class="punto">!</span><span><b>${esc(j.cliente)}</b> te debe ${gs(total(j) - cobrado(j))} desde el ${fechaCorta(j.fechaEntrega)}. <a href="${linkWhatsApp(j)}" target="_blank" rel="noopener">Recordarle por WhatsApp</a></span></section>`).join('')}
    <section class="card"><h2 class="titulo">Ganancia por mes</h2><p class="bajada">Últimos 6 meses. Tocá una barra para ver ese mes.</p><div class="grafico" id="grafMeses">${graficoMeses(meses)}</div></section>
    <section class="card"><h2 class="titulo">Lo que cobraste</h2>
      ${d.cob ? `<p class="bajada">${gs(d.cob)} en ${mesNombre(mesNum)}</p>
      <div class="split" role="img" aria-label="Materiales ${pm}%, ganancia ${100 - pm}%"><div style="flex:${Math.max(d.mat, 0)};background:var(--mat)"></div><div style="flex:${Math.max(d.gan, 0)};background:var(--accent)"></div></div>
      <div class="leyenda"><span><i style="background:var(--mat)"></i>Materiales y envío <b class="num">${gs(d.mat)}</b> · ${pm}%</span><span><i style="background:var(--accent)"></i>Tu ganancia <b class="num">${gs(d.gan)}</b> · ${100 - pm}%</span></div>` : '<p class="bajada" style="margin:0">Todavía nada este mes.</p>'}
    </section>
    <section class="card"><h2 class="titulo">Mejores clientes</h2><p class="bajada">Por ganancia en ${mesNombre(mesNum)}</p>${ranking(d.cli)}</section>
    <section class="card"><h2 class="titulo">Por tipo de trabajo</h2><p class="bajada">Qué te deja más ganancia</p>${ranking(d.tipos)}</section>`;
  el.querySelectorAll('[data-mesg]').forEach(r => {
    const k = r.dataset.mesg, dm = datosMes(k);
    r.onmousemove = e => tip(e, `<b>${mesNombre(k)}</b><br>Ganancia ${gs(dm.gan)}<br>Cobrado ${gs(dm.cob)}`);
    r.onmouseleave = () => tip(null);
    r.onclick = () => { tip(null); mesNum = k; renderNumeros(); };
  });
  const nav = el.querySelector('.meses'); const on = nav.querySelector('.on'); if (on) nav.scrollLeft = on.offsetLeft - 40;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-mesn]'); if (b) { mesNum = b.dataset.mesn; renderNumeros(); } });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {});
</script>
</body>
</html>
